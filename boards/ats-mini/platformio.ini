; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ats-mini]
board = esp32s3
board_build.partitions = support_files/custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 16MB
board_build.maximum_size = 16777216

build_flags =
	${env.build_flags}
	# Device Specific build flags
	;-DBOARD_HAS_PSRAM			# Set it if board has PSRAM
	;-DARDUINO_USB_MODE=1		# ESP32S3 usually use it
	;-DARDUINO_USB_CDC_ON_BOOT=1 # ESP32S3 usually use it

	# Device information
	-DDEVICE_NAME='"ATS Mini"'
	-DOTA_TAG='"ats-mini"' # This tag must be added into the OTA Backend
	-DOTA_EXTRA='"esp=S3"'          # OPTIONAL > to specify an extra query to the search API search
	; -DDISABLE_OTA                     # Disable OTA Functionality
	-DLAUNCHER_DEFAULT_SPIFFS_THRESHOLD=0x500000 # data partition above this size on manifest will be maximized

	# Screen default rotation
	-DROTATION=3

	# Navigation layout
	-DHAS_ENCODER=1   # Encoder + 1 button for Select (needs lib_deps below)

	# Display Pinouts
	# Data bus: 0 Arduino_HWSPI (shared SPI) | 1 Arduino_ESP32QSPI (quad SPI,
	# AMOLEDs) | 2 Arduino_ESP32PAR8Q (8-bit parallel, D0-D7 on one GPIO bank)
	# 3 Arduino_ESP32RGBPanel (16-bit parallel RGB) | 4 Arduino_ESP32DSIPanel
	# (ESP32-P4) | 5 Arduino_ESP32PAR8 (8-bit parallel, D0-D7 across both banks)
	-DTFT_DATABUS_N=5
	# Panel controller. 0 ST7735 | 1 ST7789 | 2 ST7796 | 4 ILI9341 | 24 ILI9342 |
	# 28 ILI9488 | 35 RM67162 | 41 CO5300 | 22 AXS15231B | 49 RGB | 50 DSI …
	# The full table is in the DisplayDrivers README.
	-DTFT_DISPLAY_DRIVER_N=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_ROTATION=3
	-DTFT_COL_OFS1=35
	-DTFT_ROW_OFS1=0
	-DTFT_COL_OFS2=35
	-DTFT_ROW_OFS2=0
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_WR=8
	-DTFT_RD=9
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DTFT_BL=38
	-DTFT_IPS=1

	# Battery pin, if using voltage divider
	-DANALOG_BAT_PIN=4

	# SDCard macros needed to use SPI setup (disabled - no SD on ATS Mini)
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

build_src_filter = +<../boards/ats-mini> -<../boards/_New-Device-Model> +<../src/*> +<../lib/*> -<../lib/ArduinoJson/extras/*> -<../lib/Arduino_GFX/examples/*> -<../lib/DisplayDrivers/examples/*>

lib_deps =
	${env.lib_deps}
	mathertel/RotaryEncoder @ ^1.5.3

lib_ignore =
	SensorLib
	XPowersLib
